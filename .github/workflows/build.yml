name: Build macOS App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (macOS Release)
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -v -i beta | sort -V | tail -n 1 || true)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Build Universal Release App
        run: |
          xcodebuild \
            -project IMEIndicatorClock.xcodeproj \
            -scheme IMEIndicatorClock \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Ad-hoc Sign & Package ZIP + DMG
        run: |
          APP_SRC="build/DerivedData/Build/Products/Release/IMEIndicatorClock.app"
          STAGE_DIR="build/package/IMEIndicatorClock"
          OUT_DIR="build/artifacts"

          rm -rf "$STAGE_DIR" "$OUT_DIR"
          mkdir -p "$STAGE_DIR" "$OUT_DIR"

          cp -R "$APP_SRC" "$STAGE_DIR/IMEIndicatorClock.app"
          codesign --force --deep --sign - "$STAGE_DIR/IMEIndicatorClock.app"
          codesign -dv "$STAGE_DIR/IMEIndicatorClock.app" 2>&1
          lipo -info "$STAGE_DIR/IMEIndicatorClock.app/Contents/MacOS/IMEIndicatorClock"

          for f in dist/README*.txt; do
            [ -f "$f" ] && cp "$f" "$STAGE_DIR/"
          done

          (cd build/package && ditto -c -k --sequesterRsrc --keepParent IMEIndicatorClock "../artifacts/IMEIndicatorClock-macOS-Universal.zip")

          DMG_STAGE="build/dmg_stage"
          rm -rf "$DMG_STAGE"
          mkdir -p "$DMG_STAGE"
          cp -R "$STAGE_DIR/IMEIndicatorClock.app" "$DMG_STAGE/"
          ln -s /Applications "$DMG_STAGE/Applications"
          hdiutil create \
            -volname "IMEIndicatorClock" \
            -srcfolder "$DMG_STAGE" \
            -ov \
            -format UDZO \
            "$OUT_DIR/IMEIndicatorClock-macOS-Universal.dmg"

          ls -lh "$OUT_DIR"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IMEIndicatorClock-macOS-Universal
          path: |
            build/artifacts/IMEIndicatorClock-macOS-Universal.zip
            build/artifacts/IMEIndicatorClock-macOS-Universal.dmg
          if-no-files-found: error

      - name: Publish GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/artifacts/IMEIndicatorClock-macOS-Universal.zip
            build/artifacts/IMEIndicatorClock-macOS-Universal.dmg
          generate_release_notes: true
